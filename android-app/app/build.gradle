plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'de.l0rz.m110'
    compileSdk 34

    def baseVersionCode = 11
    def runNumber = project.findProperty("buildNumber")?.toString() ?: System.getenv("GITHUB_RUN_NUMBER")
    def appVersionCode = runNumber ? (baseVersionCode + runNumber.toInteger()) : baseVersionCode
    def appVersionName = runNumber ? "0.11.${runNumber}" : "0.11"

    defaultConfig {
        applicationId "de.l0rz.m110"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.2'
    implementation 'com.google.android.material:material:1.12.0'
    // QR-Codes & Barcodes (reines Java, kein Android-View nötig)
    implementation 'com.google.zxing:core:3.5.3'
}
